<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <meta property="og:title" content="Radical Reactor" />
  <meta property="og:description" content="Fun and interactive way to study kanji composition" />
  <meta property="og:image" content="todo" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="app" />

  <title>Radical Reactor</title> 
  <meta name="author" content="Eltaurus">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/svg+xml" href="">


  <style>

  card, group,
  drawer, sidepanel, board, null {
    display: block;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;

    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
  }

  body {
    display: grid;
    grid-template-columns: 16rem 1fr;
    grid-template-rows: 12rem 1fr;

    font-family: sans-serif;
  }

  drawer {
    display: flex;
    padding: 3rem 2rem;
    gap: 1rem;

    background: brown;
  }
  drawer card {
    position: relative;
  }

  sidepanel {
    grid-row: 1 / span 2;

    display: grid;
    align-items: start;
    align-content: start;
    gap: 0.5em;

    padding: 2em 1em;
    border-right: .5rem solid slategray;
  }

  sidepanel span {
    padding: .5em;
    padding-left: 2em;
    border: 1px solid gray;

    font-size: 1.25rem;
  }


  board {
    position: relative;
    border-color: forestgreen;

    background: beige;
    overflow: hidden;
  }
  board.panning {
    cursor: move;
  }

  null {
    position: absolute;
    
    outline: solid 4px yellowgreen;
    outline-offset: 3px;
  }

  @property --offset {
    syntax: "<length>";
    inherits: false;
    initial-value: 0;
  }

  card {
    width: 5rem;
    height: 7rem;
    position: absolute;

    font-size: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: white;
    border: slategray solid 1px;
    border-radius: 4px;

    transform: translate(calc(-1 * var(--offset)), calc(-1 * var(--offset)));
    box-shadow: 1px 1px 0 #eee,
                2px 3px 0 #eee,
                3px 4px 0 #eee,
                4px 5px 0 slategray,
                calc(3px + var(--offset)) calc(3px + var(--offset)) 3px #0007,
                calc(7px + var(--offset)) calc(7px + var(--offset)) 9px #0005;

    transition: --offset .12s ease,
                box-shadow .12s ease;
    cursor: grab;
  }
  card.holded {
    --offset: 15px;
    cursor: grabbing;
    box-shadow: 1px 1px 0 #eee,
                2px 3px 0 #eee,
                3px 4px 0 #eee,
                4px 5px 0 slategray,
                calc(3px + var(--offset)) calc(3px + var(--offset)) 20px #0003,
                calc(7px + var(--offset)) calc(7px + var(--offset)) 35px #0001;
  }

  card::after {
    content: '';
    display: block;
    position: absolute;
    inset: 0;

    //box-shadow: 4px 4px 5px #0005;
  }

  /* holded card */
  board > card {
    z-index: 10;
  }
  board > card:not(.holded) {
    visibility: hidden;
  }

  group {
    border-color: blue;
    position: absolute;

    height: min-content;
    width: min-content;

    outline: blue 1px solid;
    outline-offset: 5px;
  }
 
  </style>
</head>
<body lang="ja">
  <sidepanel lang="en-US">
    <span>one</span>
    <span>two</span>
    <span>three</span>
    <span>person</span>
    <span>power</span>
    <span>tree</span>

  </sidepanel>
  <drawer><card>一</card><card>人</card><card>木</card></drawer>
  <board>
    <card></card>
    <null>
    </null>

  </board>
 

<script>



const boardL = document.querySelector("board");
const groundNull = document.querySelector("null");

const holdedCard = document.querySelector("board > card");

let [X0, Y0] = [0, 0];

// testing setup
spawnCard([80, 50], "一", false);
spawnCard([220, 210], "一", false);
spawnCard([420, 150], "六", false);
spawnCard([280, 250], "一", false);

function spawnCard(pos, innerHTML, animated = true) {
  const newCard = document.createElement('card');
  newCard.innerHTML = innerHTML;
  newCard.style.left = `${pos[0]}px`;
  newCard.style.top = `${pos[1]}px`;

  groundNull.appendChild(newCard);

  if (animated) {
    newCard.classList.add("holded");
    requestAnimationFrame(() => {
      newCard.classList.remove("holded");
    });
  }
}



boardL.addEventListener('mousedown', ev => {
  if (ev.target === boardL) {
    boardL.classList.add("panning");
    boardL.pan0 = [X0 - ev.clientX, Y0 - ev.clientY];
  } else if (ev.target.tagName === "CARD") {
    holdedCard.classList.add("holded");
    holdedCard.innerHTML = ev.target.innerHTML;
    holdedCard.start = [ev.clientX, ev.clientY];
    holdedCard.style.translate = "0";
    holdedCard.style.left = `${parseFloat(ev.target.style.left) + X0}px`;
    holdedCard.style.top = `${parseFloat(ev.target.style.top) + Y0}px`;
    ev.target.remove();
  }
});

function releaseHold() {
  boardL.classList.remove("panning");
  if (holdedCard.classList.contains("holded")) {
    holdedCard.classList.remove("holded");

    const [dx, dy] = holdedCard.style.translate.split(' ').map(parseFloat);
    const x0 = parseFloat(holdedCard.style.left);
    const y0 = parseFloat(holdedCard.style.top);

    spawnCard([x0 + (dx ?? 0) - X0, y0 + (dy ?? 0) - Y0], holdedCard.innerHTML);
  }
}
document.addEventListener('mouseup', releaseHold);
boardL.addEventListener('mouseleave', releaseHold);

document.addEventListener('mousemove', ev => {
  if ((ev.buttons & 1) !== 1) return;
  const pos = [ev.clientX, ev.clientY];
  if (holdedCard.classList.contains("holded")) {
    const dx = pos[0] - holdedCard.start[0];
    const dy = pos[1] - holdedCard.start[1];
    holdedCard.style.translate = `${dx}px ${dy}px`;
  } else if (boardL.classList.contains("panning")) {
    X0 = pos[0] + boardL.pan0[0];
    Y0 = pos[1] + boardL.pan0[1];
    groundNull.style.translate = `${X0}px ${Y0}px`;
  }
});

</script>
</body>
</html>
